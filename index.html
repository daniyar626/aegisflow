<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No network access at all: scripts and styles only from this folder, no connections out. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="AegisFlow groups Wazuh alerts into explained cases and records the decision a named person makes.">
  <title>AegisFlow</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" id="skip" href="#main">Skip to main content</a>
  <header class="top" id="top"></header>
  <main id="main" tabindex="-1">
    <noscript>
      <p class="noscript">AegisFlow needs JavaScript to analyse alerts in your browser.</p>
      <p class="noscript" lang="kk">AegisFlow дабылдарды браузерде талдауы үшін JavaScript қажет.</p>
    </noscript>
  </main>
  <footer class="foot" id="foot"></footer>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="toasts toasts-alert" id="alerts" role="alert" aria-live="assertive"></div>

  <script src="js/i18n.js"></script>
  <script src="js/intel.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/accounts.js"></script>

</html>
